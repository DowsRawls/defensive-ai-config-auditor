id: nginx-004
domain: nginx
title: Modern minimal TLS control
description: A synthetic HTTPS control uses modern protocols and conservative response settings.
config: |
  server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    location / { proxy_pass http://app; }
  }
