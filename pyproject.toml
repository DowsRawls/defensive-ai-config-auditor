[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "defensive-ai-config-auditor"
version = "0.1.0"
description = "Defensive benchmark and evaluator for configuration security review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
da-config-audit = "defensive_ai_config_auditor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
